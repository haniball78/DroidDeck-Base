name: Unit Tests

on:
  push:
    branches:
      - feat/overview-connection-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-connection-unit-tests:
    name: Stable connection unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run the unified unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests "com.droiddeck.launcher.core.ConnectionFailureTest" \
            --tests "com.droiddeck.launcher.core.ConnectionCandidatesTest" \
            --tests "com.droiddeck.launcher.core.CpuAllocationDefaultsTest" \
            --tests "com.droiddeck.launcher.session.CoreAllocationPrefsTest" \
            --tests "com.droiddeck.launcher.core.privileged.PlainModeLatchTest" \
            --tests "com.droiddeck.launcher.session.SafetyMonitorPlainModeTest" \
            --tests "com.droiddeck.launcher.session.PlainResumePolicyTest" \
            --tests "com.droiddeck.launcher.session.SuspendStateTest" \
            --tests "com.droiddeck.launcher.core.ConnectionCardStateTest" \
            --tests "com.droiddeck.launcher.core.WirelessAdbPairingStabilityTest" \
            --tests "com.droiddeck.launcher.core.WirelessAdbAutoRestartTest" \
            --tests "com.droiddeck.launcher.core.WirelessAdbPairingRedesignTest" \
            --tests "com.droiddeck.launcher.core.NotificationAlertTest" \
            --tests "com.droiddeck.launcher.core.PairingPanelStateTest" \
            --tests "com.droiddeck.launcher.core.PairingResetTest" \
            --tests "com.droiddeck.launcher.core.AdbIdentityGeneratorTest" \
            --tests "com.droiddeck.launcher.core.AdbSlowPairingDiagnosticsTest" \
            --tests "com.droiddeck.launcher.core.WirelessAdbPatientRetryTest" \
            --tests "com.droiddeck.launcher.core.SplitScreenWindowingTest" \
            --tests "com.droiddeck.launcher.core.privileged.GovernorTierCommandsTest" \
            --tests "com.droiddeck.launcher.core.privileged.BatchCVerifyTest" \
            --tests "com.droiddeck.launcher.core.privileged.FixedPerformanceGetterTest" \
            --tests "com.droiddeck.launcher.core.privileged.AppFreezerPackageSplitTest" \
            --tests "com.droiddeck.launcher.core.privileged.GameModeBoostTest" \
            --tests "com.droiddeck.launcher.core.privileged.SessionStartTweaksDecisionTest" \
            --tests "com.droiddeck.launcher.core.privileged.PackagesVerifyChunksTest" \
            --tests "com.droiddeck.launcher.core.privileged.AdvancedGeneralFixesTest" \
            --tests "com.droiddeck.launcher.core.privileged.AdvancedTogglePolicyTest" \
            --tests "com.droiddeck.launcher.core.privileged.SuspendThreadsDiagTest" \
            --tests "com.droiddeck.launcher.session.SafetyPolicyTest" \
            --tests "com.droiddeck.launcher.core.privileged.PerformanceLogTest" \
            --tests "com.droiddeck.launcher.core.privileged.DeviceBaselineTest" \
            --tests "com.droiddeck.launcher.core.privileged.DeviceBaselineOnceTest" \
            -PndkVersion=29.0.14206865 \
            -PskipRust=true \
            --stacktrace --no-daemon 2>&1 | tee /tmp/unified-unit-tests.log

      - name: Print per-test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              print("no test-result XML files found")
              raise SystemExit(0)
          total = failures = errors = skipped = 0
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  print(f"unparsable: {path}")
                  continue
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for s in suites:
                  t = int(s.get("tests", 0)); f = int(s.get("failures", 0))
                  e = int(s.get("errors", 0)); sk = int(s.get("skipped", 0))
                  total += t; failures += f; errors += e; skipped += sk
                  print(f"{s.get('name')}: tests={t} failures={f} errors={e} skipped={sk}")
                  for tc in s.iter("testcase"):
                      for child in tc:
                          if child.tag in ("failure", "error"):
                              print(f"  FAILED: {tc.get('classname')}.{tc.get('name')}")
          print(f"TOTAL: tests={total} failures={failures} errors={errors} skipped={skipped}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-connection-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
